name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        # --legacy-peer-deps: fancy-slides peers on react-fancy ^3.0 but
        # this package doesn't directly depend on react-fancy, so strict
        # peer resolution refuses to install. The actual runtime is fine
        # since react-fancy IS a peer of consumers (the showcase, etc.).
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      # Trusted Publishing (OIDC) — no token. Trusted Publisher configured on
      # npmjs.com; the bootstrap NPM_TOKEN has been revoked.
      # Pin npm 11.18.0: npm@latest (12.0.0) ships a broken --provenance path
      # that fails with "Cannot find module 'sigstore'".
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public
