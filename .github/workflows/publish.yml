name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        # --legacy-peer-deps: fancy-slides peers on react-fancy ^3.0 but
        # this package doesn't directly depend on react-fancy, so strict
        # peer resolution refuses to install. The actual runtime is fine
        # since react-fancy IS a peer of consumers (the showcase, etc.).
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      # First publish needs NPM_TOKEN bootstrap (see root CLAUDE.md
      # "Bootstrapping a brand-new package"). Once Trusted Publisher is
      # configured on npmjs, remove the env line — OIDC takes over.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx -y npm@latest publish --provenance --access public
